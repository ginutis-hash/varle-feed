name: Build feeds (varle.lt + Google Merchant)

on:
  schedule:
    - cron: "17 */6 * * *"   # kas 6 val.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate feeds
        env:
          KAINA24_URL: ${{ secrets.KAINA24_URL }}
          GOOGLE_TSV_URL: ${{ secrets.GOOGLE_TSV_URL }}
          DELIVERY_TEXT: "1-3 d. d."
        run: python build_feed.py
      - name: Commit feeds
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add docs/varle.xml docs/google.xml data/pages.json
          git diff --cached --quiet || git commit -m "Update feeds $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
